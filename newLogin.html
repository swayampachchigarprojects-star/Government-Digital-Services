<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Government Digital Services - Login</title>

<style>

:root{

    --primary:#0B5CAD;
    --primary-dark:#084A8F;
    --background:#F4F7FA;
    --card:#ffffff;
    --border:#D8E2EC;
    --heading:#173B63;
    --text:#4F5B67;
    --placeholder:#8B96A5;
    --shadow:0 10px 30px rgba(18,38,63,.08);

    --radius:12px;

    font-family:
    "Segoe UI",
    Roboto,
    Arial,
    Helvetica,
    sans-serif;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:var(--background);

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    color:var(--text);

}

.container{

    width:100%;
    max-width:420px;

}

.header{

    text-align:center;
    margin-bottom:24px;

}

.badge{

    width:70px;
    height:70px;

    border-radius:50%;

    margin:auto auto 18px;

    background:linear-gradient(135deg,#0B5CAD,#2C7DD7);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:28px;
    font-weight:600;

    box-shadow:0 8px 20px rgba(11,92,173,.25);

}

.header h1{

    color:var(--heading);
    font-size:28px;
    font-weight:600;
    margin-bottom:8px;

}

.header p{

    color:#667585;
    font-size:15px;

}

.card{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    padding:32px;

}

.section-title{

    color:var(--heading);

    font-size:22px;
    font-weight:600;

    margin-bottom:6px;

}

.section-subtitle{

    color:#697788;

    margin-bottom:28px;

    font-size:14px;

}

.form-group{

    margin-bottom:20px;

}

label{

    display:block;

    margin-bottom:8px;

    color:#354052;

    font-size:14px;

    font-weight:600;

}

input{

    width:100%;

    height:52px;

    border:1px solid var(--border);

    border-radius:10px;

    padding:0 16px;

    font-size:15px;

    outline:none;

    transition:.25s;

    background:white;

}

input::placeholder{

    color:var(--placeholder);

}

input:focus{

    border-color:var(--primary);

    box-shadow:0 0 0 3px rgba(11,92,173,.12);

}

.password{

    position:relative;

}

.password span{

    position:absolute;

    right:16px;

    top:16px;

    color:var(--primary);

    font-size:13px;

    cursor:pointer;

    font-weight:600;

}

button{

    cursor:pointer;

    transition:.25s;

}

.login-btn{

    width:100%;

    height:52px;

    border:none;

    border-radius:10px;

    background:var(--primary);

    color:white;

    font-size:16px;

    font-weight:600;

}

.login-btn:hover{

    background:var(--primary-dark);

}

.divider{

    display:flex;

    align-items:center;

    margin:26px 0;

}

.divider::before,
.divider::after{

    content:"";

    flex:1;

    height:1px;

    background:#D8E2EC;

}

.divider span{

    margin:0 14px;

    color:#7B8794;

    font-size:13px;

}

.google{

    width:100%;

    height:52px;

    border-radius:10px;

    border:1px solid var(--border);

    background:white;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    font-size:15px;

    font-weight:600;

}

.google:hover{

    background:#F8FAFC;

}

.google img{

    width:20px;

}

.footer{

    margin-top:24px;

    text-align:center;

    font-size:13px;

    color:#7A8795;

}

.footer a{

    color:var(--primary);

    text-decoration:none;

    font-weight:600;

}

@media(max-width:480px){

.card{

padding:24px;

}

.header h1{

font-size:24px;

}

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="badge">
            GS
        </div>

        <h1>Government Digital Services</h1>

        <p>Secure Citizen Login Portal</p>

    </div>

    <div class="card">

        <div class="section-title">
            Government Digital Services
        </div>

        <div class="section-subtitle">
            Sign in to access your services securely.
        </div>

        <form id="loginForm">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <div class="password">

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        required>

                    <span onclick="togglePassword()">
                        Show
                    </span>

                </div>

            </div>

            <button class="login-btn">
                Sign In
            </button>

        </form>

        <div class="divider">

            <span>OR</span>

        </div>

        <button class="google" onclick="googleLogin()">

            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">

            Continue with Google

        </button>

        <div class="footer">

            Need assistance?
            <a href="#">Contact Support</a>

        </div>
	<div class="footer">
	    Crafted by hands	
	</div>

    </div>

</div>

<script>

function togglePassword(){

    const password=document.getElementById("password");
    const text=document.querySelector(".password span");

    if(password.type==="password"){

        password.type="text";
        text.innerHTML="Hide";

    }else{

        password.type="password";
        text.innerHTML="Show";

    }

}

document.getElementById("loginForm").addEventListener("submit",function(e){

    e.preventDefault();

    const email=document.getElementById("email").value;
    const password=document.getElementById("password").value;

    alert(
        "Login Clicked\n\nEmail: "+email+"\nPassword: "+password
    );

});

function googleLogin(){

    alert("Google Sign-In clicked.");

}

</script>

</body>
</html>
